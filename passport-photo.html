<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Passport Photo Maker</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#eef3f8;color:#13213b}.wrap{max-width:1100px;margin:auto;padding:18px}.card{background:#fff;border-radius:18px;padding:22px;box-shadow:0 8px 28px #0002}.back{display:inline-block;color:#1557a6;text-decoration:none;font-weight:700;margin-bottom:10px}.upload{display:block;border:2px dashed #1557a6;border-radius:14px;padding:26px;text-align:center;background:#f7fbff;cursor:pointer}.upload input{display:none}.upload b{font-size:18px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:15px 0}.btn{border:0;border-radius:10px;padding:13px 18px;font-weight:700;cursor:pointer}.primary{background:#f4b400;color:#111}.secondary{background:#0d2345;color:#fff}.btn:disabled{opacity:.45}.status{font-weight:700;margin:10px 0}.hint{font-size:13px;color:#68758a;line-height:1.6}.original{margin:16px 0;background:#f5f7fa;border-radius:12px;padding:12px;display:none}.original img{display:block;max-width:260px;max-height:300px;margin:auto;object-fit:contain;background:#fff}.preview-wrap{margin-top:18px;background:#dce3eb;border-radius:12px;padding:12px;overflow:auto}.a4{position:relative;width:793px;height:1123px;background:#fff;margin:auto;box-shadow:0 2px 10px #0002}.a4photo{position:absolute;width:125px;height:135px;object-fit:cover;background:#fff;border:1px solid #111;display:block}.controls{display:none;margin-top:15px;padding:15px;background:#f7f9fc;border-radius:12px}.controls label{display:block;font-size:13px;font-weight:700;margin:8px 0}.controls input{width:100%}.ready{color:#087443}.error{color:#b42318}
@media(max-width:700px){.wrap{padding:10px}.card{padding:15px}.a4{transform:scale(.43);transform-origin:top left;margin:0 0 -640px 0}.preview-wrap{height:520px}}
@media print{body{background:#fff}.wrap{display:none}.print-page{display:block!important}}
.print-page{display:none}
</style>
</head>
<body>
<div class="wrap"><div class="card">
<a class="back" href="./">← Back</a>
<h1>Passport Photo Maker</h1>
<p>Upload one photo and make six print-ready passport photos automatically.</p>
<label class="upload"><b>📷 Choose / Upload Photo</b><br><small>JPG, PNG or WEBP</small><input id="file" type="file" accept="image/jpeg,image/png,image/webp"></label>
<div class="actions"><button id="pdf" class="btn primary" disabled>⬇ Download / Save A4 PDF</button><button id="png" class="btn secondary" disabled>⬇ Download A4 PNG</button></div>
<div id="status" class="status">No photo selected.</div>
<div class="hint"><b>Final size:</b> A4 portrait • 2480 × 3508 px • 300 DPI • each photo exactly 390 × 420 px = 1.3 × 1.4 inch • six photos across the top • equal gaps • black border.</div>
<div id="originalBox" class="original"><b>Uploaded photo</b><img id="original" alt="Uploaded photo"></div>
<div class="preview-wrap"><div id="a4" class="a4"></div></div>
</div></div>
<div id="printPage" class="print-page"></div>
<script>
const file=document.getElementById('file'),status=document.getElementById('status'),a4=document.getElementById('a4'),original=document.getElementById('original'),originalBox=document.getElementById('originalBox'),pdf=document.getElementById('pdf'),png=document.getElementById('png');
const A4W=2480,A4H=3508,PW=390,PH=420,GAP=20,TOP=20;
let processedData='';
function setStatus(text,cls=''){status.textContent=text;status.className='status '+cls}
function loadImage(data){return new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=reject;im.src=data})}
function clamp(v){return Math.max(0,Math.min(255,v))}
function findSkinBox(ctx,w,h){try{const small=ctx.getImageData(0,0,w,h).data;let minX=w,minY=h,maxX=-1,maxY=-1,count=0;for(let y=Math.floor(h*.08);y<Math.floor(h*.82);y+=4){for(let x=0;x<w;x+=4){const i=(y*w+x)*4,r=small[i],g=small[i+1],b=small[i+2];const skin=r>70&&g>35&&b>20&&r>g*1.12&&g>b*1.03&&(r-b)>25&&r<250;if(skin){minX=Math.min(minX,x);minY=Math.min(minY,y);maxX=Math.max(maxX,x);maxY=Math.max(maxY,y);count++}}}return count>30&&maxX>minX?{x:minX,y:minY,w:maxX-minX,h:maxY-minY}:null}catch(e){return null}}
function makePhoto(img){
 const c=document.createElement('canvas');c.width=PW;c.height=PH;const q=c.getContext('2d',{willReadFrequently:true});
 q.fillStyle='#fff';q.fillRect(0,0,PW,PH);q.imageSmoothingEnabled=true;q.imageSmoothingQuality='high';
 const ratio=PW/PH;let sw=img.naturalWidth,sh=img.naturalHeight;
 if(sw/sh>ratio)sw=sh*ratio;else sh=sw/ratio;
 let sx=(img.naturalWidth-sw)/2,sy=(img.naturalHeight-sh)*.30;
 // A safe upper-body passport framing: leave more space above the head.
 let test=document.createElement('canvas');test.width=500;test.height=Math.round(500*img.naturalHeight/img.naturalWidth);let tq=test.getContext('2d',{willReadFrequently:true});tq.drawImage(img,0,0,test.width,test.height);const face=findSkinBox(tq,test.width,test.height);
 if(face){const scale=img.naturalWidth/test.width;const fx=(face.x+face.w/2)*scale,fy=(face.y+face.h*.5)*scale;const desiredH=Math.min(img.naturalHeight,Math.max(face.h*scale*3.7,PH*1.8));const desiredW=desiredH*ratio;if(desiredW<=img.naturalWidth&&desiredH<=img.naturalHeight){sw=desiredW;sh=desiredH;sx=Math.max(0,Math.min(img.naturalWidth-sw,fx-sw/2));sy=Math.max(0,Math.min(img.naturalHeight-sh,fy-face.h*scale*1.05))}}
 q.drawImage(img,sx,sy,sw,sh,0,0,PW,PH);
 // Gentle enhancement + conservative whitening of already-light neutral background pixels.
 const d=q.getImageData(0,0,PW,PH),p=d.data;
 for(let i=0;i<p.length;i+=4){let r=p[i],g=p[i+1],b=p[i+2],mx=Math.max(r,g,b),mn=Math.min(r,g,b);if(mx>205&&mx-mn<25){p[i]=p[i+1]=p[i+2]=255}else{p[i]=clamp(r*1.012+1);p[i+1]=clamp(g*1.012+1);p[i+2]=clamp(b*1.008+1)}}q.putImageData(d,0,0);return c.toDataURL('image/jpeg',.96)
}
function showSheet(data){a4.innerHTML='';for(let i=0;i<6;i++){const im=document.createElement('img');im.className='a4photo';im.src=data;im.alt='Passport photo';im.style.left=((TOP+i*(PW+GAP))*793/A4W)+'px';im.style.top=(TOP*1123/A4H)+'px';a4.appendChild(im)}pdf.disabled=false;png.disabled=false;setStatus('✓ Processing complete — 6 photos ready.','ready')}
file.addEventListener('change',async()=>{const f=file.files&&file.files[0];if(!f)return;if(!f.type.startsWith('image/')){setStatus('Please select a JPG, PNG or WEBP image.','error');return}setStatus('Reading photo…');try{const reader=new FileReader();const data=await new Promise((res,rej)=>{reader.onload=()=>res(reader.result);reader.onerror=rej;reader.readAsDataURL(f)});original.src=data;originalBox.style.display='block';setStatus('Processing crop and enhancement…');const img=await loadImage(data);processedData=makePhoto(img);showSheet(processedData)}catch(e){console.error(e);setStatus('Could not process this photo. Please try another JPG/PNG.','error')}});
png.addEventListener('click',async()=>{if(!processedData)return;try{const c=document.createElement('canvas');c.width=A4W;c.height=A4H;const q=c.getContext('2d');q.fillStyle='#fff';q.fillRect(0,0,A4W,A4H);const im=await loadImage(processedData);for(let i=0;i<6;i++){const x=TOP+i*(PW+GAP);q.drawImage(im,x,TOP,PW,PH);q.strokeStyle='#111';q.lineWidth=4;q.strokeRect(x+2,TOP+2,PW-4,PH-4)}const a=document.createElement('a');a.href=c.toDataURL('image/png');a.download='Anvi_Passport_A4_300DPI.png';a.click();setStatus('✓ A4 PNG downloaded.','ready')}catch(e){console.error(e);setStatus('PNG export failed.','error')}});
pdf.addEventListener('click',async()=>{if(!processedData)return;try{const im=await loadImage(processedData);let imgs='';for(let i=0;i<6;i++){const x=(TOP+i*(PW+GAP))*210/A4W;const y=TOP*297/A4H;imgs+='<img src="'+processedData+'" style="position:absolute;left:'+x+'mm;top:'+y+'mm;width:33.02mm;height:35.56mm;object-fit:cover;border:.35mm solid #111;box-sizing:border-box">'}const w=window.open('','_blank');if(!w){setStatus('Please allow pop-ups to save the PDF.','error');return}w.document.write('<!doctype html><html><head><title>Anvi Passport A4</title><style>@page{size:A4 portrait;margin:0}html,body{margin:0;width:210mm;height:297mm;background:white}body{position:relative}</style></head><body>'+imgs+'</body></html>');w.document.close();setTimeout(()=>{w.focus();w.print()},700);setStatus('✓ Print dialog opened — choose “Save as PDF”.','ready')}catch(e){console.error(e);setStatus('PDF export failed. Try PNG download.','error')}});
</script>
</body>
</html>
