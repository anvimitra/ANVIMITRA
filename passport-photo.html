<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Passport Photo Maker | ANVI E-Mitra & CSC Centre</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#eef3f8;color:#172033}.box{max-width:1050px;margin:20px auto;background:#fff;padding:22px;border-radius:16px;box-shadow:0 4px 20px #0001}.up{display:block;border:2px dashed #1760a8;border-radius:12px;padding:30px;text-align:center;cursor:pointer;background:#f8fbff}.up input{display:block;margin:14px auto 0;max-width:100%;font-size:16px}.buttons{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}button{padding:12px 18px;border:0;border-radius:9px;font-weight:bold;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}.pdf{background:#f4b400}.png{background:#10264d;color:#fff}.status{margin:14px 0;font-weight:bold;line-height:1.45}.note{font-size:13px;color:#667085;line-height:1.5}.preview{overflow:auto;background:#dce3eb;padding:12px;border-radius:10px}.a4{width:793px;height:1123px;background:#fff;position:relative;margin:auto}.p{position:absolute;width:125px;height:135px;object-fit:cover;border:1px solid #111;background:#fff}
</style>
</head>
<body>
<div class="box">
<a href="./">← Back</a><h1>Passport Photo Maker</h1>
<p>Upload a photo and create 6 AI-enhanced passport photos on an A4 print sheet.</p>
<label class="up"><div style="font-size:20px">📷 <b>Choose Photo</b></div><small>JPG / PNG / WEBP</small><input id="file" type="file" accept="image/*"></label>
<div class="buttons"><button id="pdf" class="pdf" disabled>⬇ Save / Print A4 PDF</button><button id="png" class="png" disabled>⬇ Download A4 PNG</button></div>
<div id="status" class="status">Choose a photo.</div>
<p class="note">AI person segmentation • pure white background • AI face detection • natural head/shoulder framing • subtle enhancement • A4 300 DPI • 1.3×1.4 inch photos • 6 copies.</p>
<div class="preview"><div id="a4" class="a4"></div></div>
</div>
<script>
const fileInput=document.getElementById('file'),statusEl=document.getElementById('status'),a4=document.getElementById('a4'),pdfBtn=document.getElementById('pdf'),pngBtn=document.getElementById('png');
const W=2480,H=3508,PW=390,PH=420,G=20,M=20;let photoData='',sheetBlob=null,faceDetectorPromise=null,segmenterPromise=null;
const loadImage=u=>new Promise((r,j)=>{const i=new Image;i.onload=()=>r(i);i.onerror=j;i.src=u});

async function detectFace(img){
 try{
  if(faceDetectorPromise===null){faceDetectorPromise=import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22-rc.20250304/+esm').then(async v=>{const fileset=await v.FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22-rc.20250304/wasm');return v.FaceDetector.createFromOptions(fileset,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite',delegate:'CPU'},runningMode:'IMAGE',minDetectionConfidence:.45})}).catch(e=>{faceDetectorPromise=null;throw e})}
  const d=await faceDetectorPromise,r=d.detect(img),b=r.detections&&r.detections[0]&&r.detections[0].boundingBox;if(b)return{x:b.originX,y:b.originY,width:b.width,height:b.height};
 }catch(e){console.warn('MediaPipe face detector:',e)}
 try{if('FaceDetector'in window){const d=new FaceDetector({fastMode:true,maxDetectedFaces:1}),f=await d.detect(img);if(f[0])return f[0].boundingBox}}catch(e){console.warn('Native face detector:',e)}
 return null;
}

async function getSegmenter(){
 if(segmenterPromise)return segmenterPromise;
 segmenterPromise=(async()=>{
  const v=await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22-rc.20250304/+esm');
  const fileset=await v.FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22-rc.20250304/wasm');
  return v.ImageSegmenter.createFromOptions(fileset,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_segmenter/float16/latest/selfie_segmenter.tflite',delegate:'CPU'},runningMode:'IMAGE',outputCategoryMask:true,outputConfidenceMasks:true});
 })().catch(e=>{segmenterPromise=null;throw e});
 return segmenterPromise;
}

function makeSegmentationCanvas(mask){
 const mw=mask.width,mh=mask.height,vals=mask.values,mc=document.createElement('canvas');mc.width=mw;mc.height=mh;const mx=mc.getContext('2d'),md=mx.createImageData(mw,mh),p=md.data;
 for(let i=0,j=0;i<vals.length;i++,j+=4){let v=vals[i];if(!Number.isFinite(v))v=0;v=Math.max(0,Math.min(1,v));const a=Math.round(Math.max(0,(v-.18)/.62)*255);p[j]=255;p[j+1]=255;p[j+2]=255;p[j+3]=a}
 mx.putImageData(md,0,0);return mc;
}

async function aiCut(file,orig){
 statusEl.textContent='🤖 AI person segmentation loading…';
 const seg=await getSegmenter();
 statusEl.textContent='🤖 AI removing background…';
 const maxSide=1024,scale=Math.min(1,maxSide/Math.max(orig.naturalWidth,orig.naturalHeight));
 const sc=document.createElement('canvas');sc.width=Math.max(1,Math.round(orig.naturalWidth*scale));sc.height=Math.max(1,Math.round(orig.naturalHeight*scale));const sx=sc.getContext('2d');sx.imageSmoothingQuality='high';sx.drawImage(orig,0,0,sc.width,sc.height);
 const result=seg.segment(sc);
 try{
  let maskObj=null,vals=null;
  if(result.confidenceMasks&&result.confidenceMasks.length){maskObj=result.confidenceMasks.length>1?result.confidenceMasks[1]:result.confidenceMasks[0];vals=maskObj.getAsFloat32Array()}
  else if(result.categoryMask){maskObj=result.categoryMask;vals=maskObj.getAsFloat32Array()}
  if(!maskObj||!vals||!vals.length)throw new Error('AI segmentation returned no mask');
  const maskCanvas=makeSegmentationCanvas({width:maskObj.width,height:maskObj.height,values:vals});
  return {maskCanvas,scale,maskWidth:maskObj.width,maskHeight:maskObj.height};
 }finally{if(result&&typeof result.close==='function')result.close()}
}

function enhance(c){const d=c.getImageData(0,0,PW,PH),p=d.data;for(let i=0;i<p.length;i+=4){p[i]=Math.min(255,Math.max(0,(p[i]-128)*1.012+130));p[i+1]=Math.min(255,Math.max(0,(p[i+1]-128)*1.012+130));p[i+2]=Math.min(255,Math.max(0,(p[i+2]-128)*1.012+130))}c.putImageData(d,0,0)}

async function makePhoto(file){
 const original=URL.createObjectURL(file);
 try{
  const orig=await loadImage(original);statusEl.textContent='🤖 AI detecting face…';const face=await detectFace(orig);const seg=await aiCut(file,orig);
  const sw=orig.naturalWidth,sh=orig.naturalHeight,ratio=PW/PH;let cw=sw,ch=sw/ratio,sx=(sw-cw)/2,sy=(sh-ch)*.12;
  if(ch>sh){ch=sh;cw=ch*ratio;sy=0}
  if(face){
   statusEl.textContent='👤 AI face found — keeping extra headroom and shoulders…';
   // Use a deliberately wider crop so hair, neck and both shoulders remain visible.
   // The face is only an anchor; it is not allowed to fill most of the passport frame.
   const targetFaceRatio=.42;
   ch=Math.min(sh,Math.max(face.height/targetFaceRatio,face.height*2.38));
   cw=ch*ratio;
   if(cw>sw){cw=sw;ch=cw/ratio}
   const fx=face.x+face.width/2;
   sx=fx-cw/2;
   // More headroom above the detector box prevents the top of the hair/head being cut.
   sy=face.y-face.height*.42;
  }
  sx=Math.max(0,Math.min(sw-cw,sx));sy=Math.max(0,Math.min(sh-ch,sy));
  const out=document.createElement('canvas');out.width=PW;out.height=PH;const o=out.getContext('2d');o.imageSmoothingEnabled=true;o.imageSmoothingQuality='high';o.fillStyle='#fff';o.fillRect(0,0,PW,PH);
  const fg=document.createElement('canvas');fg.width=PW;fg.height=PH;const f=fg.getContext('2d');f.imageSmoothingEnabled=true;f.imageSmoothingQuality='high';f.drawImage(orig,sx,sy,cw,ch,0,0,PW,PH);
  const cropMask=document.createElement('canvas');cropMask.width=PW;cropMask.height=PH;const cm=cropMask.getContext('2d');const mx=sx*seg.scale,my=sy*seg.scale,mw=cw*seg.scale,mh=ch*seg.scale;cm.drawImage(seg.maskCanvas,mx,my,mw,mh,0,0,PW,PH);
  f.globalCompositeOperation='destination-in';f.drawImage(cropMask,0,0);f.globalCompositeOperation='source-over';o.drawImage(fg,0,0);enhance(o);
  return out.toDataURL('image/jpeg',.97);
 }finally{URL.revokeObjectURL(original)}
}

function buildSheet(){const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,W,H);return loadImage(photoData).then(im=>{for(let i=0;i<6;i++){const xx=M+i*(PW+G);x.drawImage(im,xx,M,PW,PH);x.strokeStyle='#111';x.lineWidth=4;x.strokeRect(xx+2,M+2,PW-4,PH-4)}return new Promise(r=>c.toBlob(r,'image/png'))})}
function preview(){a4.innerHTML='';for(let i=0;i<6;i++){const im=document.createElement('img');im.className='p';im.src=photoData;im.style.left=((M+i*(PW+G))*793/W)+'px';im.style.top=(M*1123/H)+'px';a4.appendChild(im)}}
fileInput.onchange=async()=>{const f=fileInput.files[0];if(!f)return;pdfBtn.disabled=pngBtn.disabled=true;sheetBlob=null;photoData='';a4.innerHTML='';try{photoData=await makePhoto(f);preview();statusEl.textContent='📄 Creating exact A4 sheet…';sheetBlob=await buildSheet();pdfBtn.disabled=pngBtn.disabled=false;statusEl.textContent='✓ Complete — AI background removed, pure white background applied, natural face/head/shoulder framing and A4 sheet ready.'}catch(e){console.error(e);statusEl.textContent='❌ AI processing failed: '+(e?.message||e);pdfBtn.disabled=pngBtn.disabled=true}};
pngBtn.onclick=()=>{if(!sheetBlob)return;const u=URL.createObjectURL(sheetBlob),a=document.createElement('a');a.href=u;a.download='ANVI_E-Mitra_A4_300DPI.png';a.click();setTimeout(()=>URL.revokeObjectURL(u),1500)};
pdfBtn.onclick=()=>{if(!photoData)return;const w=open('','_blank');if(!w)return;let q='';for(let i=0;i<6;i++){const xx=(M+i*(PW+G))*210/W,yy=M*297/H;q+=`<img src="${photoData}" style="position:absolute;left:${xx}mm;top:${yy}mm;width:33.02mm;height:35.56mm;object-fit:cover;border:.35mm solid #111">`}w.document.write(`<style>@page{size:A4;margin:0}body{margin:0}</style>${q}`);w.document.close();setTimeout(()=>w.print(),700)};
</script>
</body>
</html>
