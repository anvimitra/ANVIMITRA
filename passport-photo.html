<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Passport Photo Maker | ANVI E-Mitra & CSC Centre</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#eef3f8;color:#172033}.box{max-width:1050px;margin:20px auto;background:#fff;padding:22px;border-radius:16px;box-shadow:0 4px 20px #0001}.up{display:block;border:2px dashed #1760a8;border-radius:12px;padding:30px;text-align:center;cursor:pointer;background:#f8fbff}.up:hover{background:#eef7ff}.up input{display:block;margin:14px auto 0;max-width:100%;font-size:16px}.buttons{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}button{padding:12px 18px;border:0;border-radius:9px;font-weight:bold;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}.pdf{background:#f4b400}.png{background:#10264d;color:#fff}.status{margin:14px 0;font-weight:bold}.note{font-size:13px;color:#667085}.preview{overflow:auto;background:#dce3eb;padding:12px;border-radius:10px}.a4{width:793px;height:1123px;background:#fff;position:relative;margin:auto}.p{position:absolute;width:125px;height:135px;object-fit:cover;border:1px solid #111;background:#fff}</style></head>
<body><div class="box"><a href="./">← Back</a><h1>Passport Photo Maker</h1><p>Upload a photo and create 6 enhanced passport photos on an A4 print sheet.</p><label class="up"><div style="font-size:20px">📷 <b>Choose Photo</b></div><small>JPG / PNG / WEBP</small><input id="file" type="file" accept="image/jpeg,image/png,image/webp,image/*"></label><div class="buttons"><button id="pdf" class="pdf" disabled>⬇ Save / Print A4 PDF</button><button id="png" class="png" disabled>⬇ Download A4 PNG</button></div><div id="status" class="status">Choose a photo.</div><p class="note">AI portrait background removal • pure white background • subtle natural enhancement • A4 300 DPI • 1.3×1.4 inch photos • 6 copies.</p><div class="preview"><div id="a4" class="a4"></div></div></div>
<script>
const fileInput=document.getElementById('file'),statusEl=document.getElementById('status'),a4=document.getElementById('a4'),pdfBtn=document.getElementById('pdf'),pngBtn=document.getElementById('png');
const W=2480,H=3508,PW=390,PH=420,G=20,M=20;let photoData='',sheetBlob=null;
function status(t){statusEl.textContent=t}
function loadImage(src){return new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=()=>reject(new Error('Image could not be loaded'));im.src=src})}
function enhance(ctx,w,h){const d=ctx.getImageData(0,0,w,h),p=d.data;for(let i=0;i<p.length;i+=4){let r=p[i],g=p[i+1],b=p[i+2],lum=.299*r+.587*g+.114*b;const contrast=1.025, lift=lum<120?2.5:1.0;r=Math.max(0,Math.min(255,(r-128)*contrast+128+lift));g=Math.max(0,Math.min(255,(g-128)*contrast+128+lift));b=Math.max(0,Math.min(255,(b-128)*contrast+128+lift));p[i]=r;p[i+1]=g;p[i+2]=b}ctx.putImageData(d,0,0)}
function fallbackWhiten(ctx,w,h){const d=ctx.getImageData(0,0,w,h),p=d.data,seen=new Uint8Array(w*h),q=[];const idx=(x,y)=>y*w+x;for(let x=0;x<w;x++){q.push([x,0]);q.push([x,h-1])}for(let y=1;y<h-1;y++){q.push([0,y]);q.push([w-1,y])}let head=0;while(head<q.length){const [x,y]=q[head++],k=idx(x,y),j=k*4;if(seen[k])continue;seen[k]=1;const r=p[j],g=p[j+1],b=p[j+2],lum=.299*r+.587*g+.114*b;if(lum>205 && Math.max(r,g,b)-Math.min(r,g,b)<42){p[j]=255;p[j+1]=255;p[j+2]=255;for(const [nx,ny] of [[x+1,y],[x-1,y],[x,y+1],[x,y-1]])if(nx>=0&&nx<w&&ny>=0&&ny<h)q.push([nx,ny])}}ctx.putImageData(d,0,0)}
async function aiRemoveBackground(file){status('Loading AI background remover…');const mod=await import('https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.7.0/+esm');const removeBackground=mod.default||mod.removeBackground;status('AI is removing the background…');const blob=await removeBackground(file,{model:'isnet_fp16',output:{format:'image/png',quality:1},progress:(key,current,total)=>{if(total)status('AI background removal: '+Math.round(current/total*100)+'%')}});return URL.createObjectURL(blob)}
async function makePhoto(file){const originalUrl=URL.createObjectURL(file);let cutoutUrl=null;try{try{cutoutUrl=await aiRemoveBackground(file)}catch(err){console.warn('AI background removal unavailable, using local fallback',err);status('AI unavailable — using local white-background processing…');cutoutUrl=originalUrl}const im=await loadImage(cutoutUrl),sw=im.naturalWidth,sh=im.naturalHeight,c=document.createElement('canvas');c.width=PW;c.height=PH;const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,PW,PH);ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';const target=PW/PH;let cw,ch;if(sw/sh>target){ch=sh;cw=ch*target}else{cw=sw;ch=cw/target}const sx=(sw-cw)/2,sy=(sh-ch)/2;ctx.drawImage(im,sx,sy,cw,ch,0,0,PW,PH);if(cutoutUrl!==originalUrl){ctx.globalCompositeOperation='destination-over';ctx.fillStyle='#fff';ctx.fillRect(0,0,PW,PH);ctx.globalCompositeOperation='source-over'}else{fallbackWhiten(ctx,PW,PH)}status('Applying subtle natural enhancement…');enhance(ctx,PW,PH);return c.toDataURL('image/jpeg',.97)}finally{URL.revokeObjectURL(originalUrl);if(cutoutUrl&&cutoutUrl!==originalUrl)URL.revokeObjectURL(cutoutUrl)}}
function buildSheet(){const c=document.createElement('canvas');c.width=W;c.height=H;const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);return loadImage(photoData).then(im=>{for(let i=0;i<6;i++){const x=M+i*(PW+G);ctx.drawImage(im,x,M,PW,PH);ctx.strokeStyle='#111';ctx.lineWidth=4;ctx.strokeRect(x+2,M+2,PW-4,PH-4)}return new Promise(resolve=>c.toBlob(resolve,'image/png'))})}
function renderPreview(){a4.innerHTML='';for(let i=0;i<6;i++){const im=document.createElement('img');im.className='p';im.src=photoData;im.style.left=((M+i*(PW+G))*793/W)+'px';im.style.top=(M*1123/H)+'px';a4.appendChild(im)}}
fileInput.addEventListener('change',async()=>{const file=fileInput.files&&fileInput.files[0];if(!file)return;if(!file.type.startsWith('image/')){status('Please select a JPG, PNG or WEBP image.');return}pdfBtn.disabled=true;pngBtn.disabled=true;sheetBlob=null;try{photoData=await makePhoto(file);renderPreview();status('Creating A4 sheet…');sheetBlob=await buildSheet();pdfBtn.disabled=false;pngBtn.disabled=false;status('✓ Ready: AI white background + subtle enhancement + 6 A4 photos.')}catch(e){console.error(e);status('Photo processing failed: '+(e.message||e))}});
pngBtn.addEventListener('click',()=>{if(!sheetBlob)return;const url=URL.createObjectURL(sheetBlob),a=document.createElement('a');a.href=url;a.download='ANVI_E-Mitra_Passport_A4_300DPI.png';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);status('✓ A4 PNG download started.')});
pdfBtn.addEventListener('click',()=>{if(!photoData)return;const w=window.open('','_blank');if(!w){status('Please allow pop-ups for PDF printing.');return}let imgs='';for(let i=0;i<6;i++){const x=(M+i*(PW+G))*210/W,y=M*297/H;imgs+=`<img src="${photoData}" style="position:absolute;left:${x}mm;top:${y}mm;width:33.02mm;height:35.56mm;object-fit:cover;border:.35mm solid #111">`}w.document.write(`<!doctype html><html><head><title>ANVI E-Mitra A4</title><style>@page{size:A4;margin:0}html,body{margin:0;width:210mm;height:297mm;background:#fff}</style></head><body>${imgs}</body></html>`);w.document.close();setTimeout(()=>w.print(),500)});
</script></body></html>
