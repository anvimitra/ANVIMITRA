<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Passport Photo Maker | ANVI E-Mitra & CSC Centre</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#eef3f8;color:#172033}.box{max-width:1050px;margin:20px auto;background:#fff;padding:22px;border-radius:16px;box-shadow:0 4px 20px #0001}.up{display:block;border:2px dashed #1760a8;border-radius:12px;padding:30px;text-align:center;cursor:pointer;background:#f8fbff}.up input{display:block;margin:14px auto 0;max-width:100%;font-size:16px}.buttons{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}button{padding:12px 18px;border:0;border-radius:9px;font-weight:bold;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}.pdf{background:#f4b400}.png{background:#10264d;color:#fff}.status{margin:14px 0;font-weight:bold}.note{font-size:13px;color:#667085}.preview{overflow:auto;background:#dce3eb;padding:12px;border-radius:10px}.a4{width:793px;height:1123px;background:#fff;position:relative;margin:auto}.p{position:absolute;width:125px;height:135px;object-fit:cover;border:1px solid #111;background:#fff}</style></head><body><div class="box"><a href="./">← Back</a><h1>Passport Photo Maker</h1><p>Upload a photo and create 6 enhanced passport photos on an A4 print sheet.</p><label class="up"><div style="font-size:20px">📷 <b>Choose Photo</b></div><small>JPG / PNG / WEBP</small><input id="file" type="file" accept="image/*"></label><div class="buttons"><button id="pdf" class="pdf" disabled>⬇ Save / Print A4 PDF</button><button id="png" class="png" disabled>⬇ Download A4 PNG</button></div><div id="status" class="status">Choose a photo.</div><p class="note">Face detection • AI background removal • pure white background • subtle enhancement • A4 300 DPI • 1.3×1.4 inch photos • 6 copies.</p><div class="preview"><div id="a4" class="a4"></div></div></div><script>
const fileInput=document.getElementById('file'),statusEl=document.getElementById('status'),a4=document.getElementById('a4'),pdfBtn=document.getElementById('pdf'),pngBtn=document.getElementById('png');const W=2480,H=3508,PW=390,PH=420,G=20,M=20;let photoData='',sheetBlob=null;
const loadImage=u=>new Promise((r,j)=>{const i=new Image;i.onload=()=>r(i);i.onerror=j;i.src=u});
async function detectFace(img){try{if(!('FaceDetector'in window))return null;const d=new FaceDetector({fastMode:true,maxDetectedFaces:1}),f=await d.detect(img);return f[0]?.boundingBox||null}catch(e){return null}}
async function aiCut(file){try{statusEl.textContent='AI removing background…';const m=await import('https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.7.0/+esm'),fn=m.default||m.removeBackground,b=await Promise.race([fn(file,{model:'isnet_fp16',output:{format:'image/png',quality:.9}}),new Promise((_,j)=>setTimeout(()=>j(new Error('timeout')),30000))]);return URL.createObjectURL(b)}catch(e){return null}}
function enhance(c){const d=c.getImageData(0,0,PW,PH),p=d.data;for(let i=0;i<p.length;i+=4){p[i]=Math.min(255,Math.max(0,(p[i]-128)*1.02+130));p[i+1]=Math.min(255,Math.max(0,(p[i+1]-128)*1.02+130));p[i+2]=Math.min(255,Math.max(0,(p[i+2]-128)*1.02+130))}c.putImageData(d,0,0)}
async function makePhoto(file){const original=URL.createObjectURL(file),cut=await aiCut(file);try{const src=cut||original,im=await loadImage(src),sw=im.naturalWidth,sh=im.naturalHeight,face=await detectFace(im);const c=document.createElement('canvas');c.width=PW;c.height=PH;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,PW,PH);const ratio=PW/PH;let cw=sw,ch=sw/ratio;if(ch>sh){ch=sh;cw=ch*ratio}let sx=(sw-cw)/2,sy=(sh-ch)*.34;if(face){statusEl.textContent='Face detected — framing at ~80%…';const fx=face.x+face.width/2,fy=face.y+face.height/2;const desiredFaceH=ch*.72;const scale=Math.max(1,Math.min(1.5,desiredFaceH/face.height));cw=Math.min(sw,cw/scale);ch=Math.min(sh,ch/scale);sx=fx-cw/2;sy=fy-ch*.43}sx=Math.max(0,Math.min(sw-cw,sx));sy=Math.max(0,Math.min(sh-ch,sy));x.imageSmoothingEnabled=true;x.imageSmoothingQuality='high';x.drawImage(im,sx,sy,cw,ch,0,0,PW,PH);if(!cut){const d=x.getImageData(0,0,PW,PH),p=d.data;for(let i=0;i<p.length;i+=4){const r=p[i],g=p[i+1],b=p[i+2],l=.299*r+.587*g+.114*b;if(l>225&&Math.max(r,g,b)-Math.min(r,g,b)<25)p[i]=p[i+1]=p[i+2]=255}x.putImageData(d,0,0)}enhance(x);return c.toDataURL('image/jpeg',.96)}finally{URL.revokeObjectURL(original);if(cut)URL.revokeObjectURL(cut)}}
function buildSheet(){const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,W,H);return loadImage(photoData).then(im=>{for(let i=0;i<6;i++){const xx=M+i*(PW+G);x.drawImage(im,xx,M,PW,PH);x.strokeStyle='#111';x.lineWidth=4;x.strokeRect(xx+2,M+2,PW-4,PH-4)}return new Promise(r=>c.toBlob(r,'image/png'))})}function preview(){a4.innerHTML='';for(let i=0;i<6;i++){const im=document.createElement('img');im.className='p';im.src=photoData;im.style.left=((M+i*(PW+G))*793/W)+'px';im.style.top=(M*1123/H)+'px';a4.appendChild(im)}}fileInput.onchange=async()=>{const f=fileInput.files[0];if(!f)return;pdfBtn.disabled=pngBtn.disabled=true;try{photoData=await makePhoto(f);preview();statusEl.textContent='Creating A4 sheet…';sheetBlob=await buildSheet();pdfBtn.disabled=pngBtn.disabled=false;statusEl.textContent='✓ Ready — face ~80%, white background and enhancement applied.'}catch(e){console.error(e);statusEl.textContent='Processing failed. Please try another photo.'}};pngBtn.onclick=()=>{const u=URL.createObjectURL(sheetBlob),a=document.createElement('a');a.href=u;a.download='ANVI_E-Mitra_A4_300DPI.png';a.click();setTimeout(()=>URL.revokeObjectURL(u),1500)};pdfBtn.onclick=()=>{const w=open('','_blank');if(!w)return;let q='';for(let i=0;i<6;i++){const x=(M+i*(PW+G))*210/W,y=M*297/H;q+=`<img src="${photoData}" style="position:absolute;left:${x}mm;top:${y}mm;width:33.02mm;height:35.56mm;object-fit:cover;border:.35mm solid #111">`}w.document.write(`<style>@page{size:A4;margin:0}body{margin:0}</style>${q}`);w.document.close();setTimeout(()=>w.print(),500)};
</script></body></html>
