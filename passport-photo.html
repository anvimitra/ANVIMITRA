<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Passport Photo Maker</title><style>body{font-family:Arial;background:#eef3f8;margin:0}.box{max-width:1050px;margin:20px auto;background:#fff;padding:22px;border-radius:16px}.up{display:block;border:2px dashed #1760a8;padding:28px;text-align:center;cursor:pointer}.up input{display:none}button{padding:12px 18px;margin:14px 8px 14px 0;border:0;border-radius:9px;font-weight:bold}.pdf{background:#f4b400}.png{background:#10264d;color:white}.a4{width:793px;height:1123px;background:#fff;position:relative;margin:auto;overflow:hidden}.p{position:absolute;width:125px;height:135px;object-fit:cover;border:1px solid #111;background:#fff}.status{font-weight:bold}.preview{overflow:auto;background:#dce3eb;padding:12px}.note{font-size:13px;color:#667085}</style></head><body><div class="box"><a href="./">← Back</a><h1>Passport Photo Maker</h1><p>AI passport photo processing • A4 • 300 DPI</p><label class="up">📷 <b>Choose Photo</b><br><small>JPG / PNG / WEBP</small><input id="f" type="file" accept="image/*"></label><button id="pdf" class="pdf" disabled>⬇ Save A4 PDF</button><button id="png" class="png" disabled>⬇ Download A4 PNG</button><div id="s" class="status">Choose a photo.</div><p class="note">A4 2480×3508 px • photo 390×420 px (1.3×1.4 inch) • 6 photos • equal gap • black stroke • pure white background.</p><div class="preview"><div id="a" class="a4"></div></div></div><script type="module">import removeBackground from 'https://esm.sh/@imgly/background-removal@1.7.0?target=es2022';const f=document.getElementById('f'),a=document.getElementById('a'),s=document.getElementById('s'),pdf=document.getElementById('pdf'),png=document.getElementById('png');const W=2480,H=3508,PW=390,PH=420,G=20,M=20;let data='',blob=null;const img=x=>new Promise((r,j)=>{let i=new Image;i.onload=()=>r(i);i.onerror=j;i.src=x});function status(x){s.textContent=x}function enhance(c){let q=c.getContext('2d'),d=q.getImageData(0,0,c.width,c.height),p=d.data;for(let i=0;i<p.length;i+=4){let av=(p[i]+p[i+1]+p[i+2])/3;p[i]=Math.min(255,(p[i]-av)*1.01+av*1.025+1);p[i+1]=Math.min(255,(p[i+1]-av)*1.01+av*1.025+1);p[i+2]=Math.min(255,(p[i+2]-av)*1.01+av*1.025+1)}q.putImageData(d,0,0)}async function process(file){status('AI background removal loading…');let b=await removeBackground(file,{model:'isnet',output:{format:'image/png',quality:1},progress:(k,c,t)=>t&&status('AI background removal: '+Math.round(c/t*100)+'%')});let u=URL.createObjectURL(b),im=await img(u);URL.revokeObjectURL(u);let w=im.naturalWidth,h=im.naturalHeight,t=document.createElement('canvas');t.width=w;t.height=h;let q=t.getContext('2d');q.drawImage(im,0,0);let d=q.getImageData(0,0,w,h).data,minx=w,miny=h,maxx=-1,maxy=-1;for(let y=0;y<h;y+=2)for(let x=0;x<w;x+=2)if(d[(y*w+x)*4+3]>70){minx=Math.min(minx,x);miny=Math.min(miny,y);maxx=Math.max(maxx,x);maxy=Math.max(maxy,y)}if(maxx<0)throw Error('Person not detected');let bh=maxy-miny+1,r=PW/PH,ch=Math.min(h,Math.max(bh*1.18,PH*2.05)),cw=ch*r;if(cw>w){cw=w;ch=cw/r}let cx=(minx+maxx)/2,sx=Math.max(0,Math.min(w-cw,cx-cw/2)),sy=Math.max(0,Math.min(h-ch,miny-bh*.1));let c=document.createElement('canvas');c.width=PW;c.height=PH;q=c.getContext('2d');q.fillStyle='#fff';q.fillRect(0,0,PW,PH);q.imageSmoothingQuality='high';q.drawImage(im,sx,sy,cw,ch,0,0,PW,PH);d=q.getImageData(0,0,PW,PH);for(let i=0;i<d.data.length;i+=4)if(d.data[i+3]<245)d.data[i]=d.data[i+1]=d.data[i+2]=255,d.data[i+3]=255;q.putImageData(d,0,0);enhance(c);return c.toDataURL('image/jpeg',.97)}async function build(){let c=document.createElement('canvas');c.width=W;c.height=H;let q=c.getContext('2d');q.fillStyle='#fff';q.fillRect(0,0,W,H);let im=await img(data);for(let i=0;i<6;i++){let x=M+i*(PW+G);q.drawImage(im,x,M,PW,PH);q.strokeStyle='#111';q.lineWidth=4;q.strokeRect(x+2,M+2,PW-4,PH-4)}blob=await new Promise(r=>c.toBlob(r,'image/png'));a.innerHTML='';for(let i=0;i<6;i++){let z=document.createElement('img');z.className='p';z.src=data;z.style.left=((M+i*(PW+G))*793/W)+'px';z.style.top=(M*1123/H)+'px';a.appendChild(z)}pdf.disabled=png.disabled=false;status('✓ Complete: white background + light enhancement + 6 photos ready.')}f.onchange=async()=>{let file=f.files?.[0];if(!file)return;pdf.disabled=png.disabled=true;try{data=await process(file);await build()}catch(e){console.error(e);status('Processing failed: '+e.message)}};png.onclick=()=>{if(!blob)return;let u=URL.createObjectURL(blob),x=document.createElement('a');x.href=u;x.download='Anvi_Passport_A4_300DPI.png';document.body.appendChild(x);x.click();x.remove();setTimeout(()=>URL.revokeObjectURL(u),3000);status('✓ PNG download started.')};pdf.onclick=()=>{let w=window.open('','_blank');if(!w)return status('Allow pop-ups for PDF');let z='';for(let i=0;i<6;i++)z+='<img src="'+data+'" style="position:absolute;left:'+((M+i*(PW+G))*210/W)+'mm;top:'+M*297/H+'mm;width:33.02mm;height:35.56mm;object-fit:cover;border:.35mm solid #111">';w.document.write('<style>@page{size:A4;margin:0}body{margin:0;width:210mm;height:297mm}</style>'+z);w.document.close();setTimeout(()=>w.print(),700)};</script></body></html>
