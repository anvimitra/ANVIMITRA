name: Patch ID Card Crop Preview
on:
  workflow_dispatch:
  push:
    paths:
      - 'id-card-print.html'
      - '.github/workflows/patch-id-crop.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch crop preview and copy workflow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('id-card-print.html')
          s=p.read_text(encoding='utf-8')
          original=s

          # Fix preview: copies means complete uploaded-image set repeated, not grid slots repeatedly filled.
          old="""let W=210,H=297,m=+$('margin').value||0,g=+$('gap').value||0,w=+$('w').value,h=+$('h').value,copies=+$('copies').value||1,cols=Math.max(1,Math.floor((W-2*m+g)/(w+g))),rows=Math.max(1,Math.floor((H-2*m+g)/(h+g))),n=0;for(let r=0;r<rows;r++)for(let col=0;col<cols;col++)for(let i=0;i<items.length;i++)for(let k=0;k<copies;k++){if(n>=cols*rows)break;let c=await cropCanvas(items[i],1000,Math.max(1,Math.round(1000*h/w)));addBox(sh,m+col*(w+g),m+r*(h+g),w,h,c);n++}$('count').textContent=n;$('summary').textContent=cols+' × '+rows+' per A4'"""
          new="""let W=210,H=297,m=+$('margin').value||0,g=+$('gap').value||0,w=+$('w').value,h=+$('h').value,copies=Math.max(1,+$('copies').value||1),cols=Math.max(1,Math.floor((W-2*m+g)/(w+g))),rows=Math.max(1,Math.floor((H-2*m+g)/(h+g))),per=cols*rows,seq=[];for(let k=0;k<copies;k++)for(let i of items)seq.push(i);let n=Math.min(seq.length,per);for(let p=0;p<n;p++){let row=Math.floor(p/cols),col=p%cols,c=await cropCanvas(seq[p],1000,Math.max(1,Math.round(1000*h/w)));addBox(sh,m+col*(w+g),m+row*(h+g),w,h,c)}$('count').textContent=n;$('summary').textContent=(seq.length>per?seq.length+' total • '+per+' shown on first A4':n+' on A4')"""
          if old not in s:
              raise SystemExit('Preview block not found')
          s=s.replace(old,new,1)

          # Make PDF follow the same copy semantics and require Crop & Preview first.
          old2="""let W=210,H=297,m=+$('margin').value||0,g=+$('gap').value||0,w=+$('w').value,h=+$('h').value,copies=+$('copies').value||1,cols=Math.max(1,Math.floor((W-2*m+g)/(w+g))),rows=Math.max(1,Math.floor((H-2*m+g)/(h+g))),per=cols*rows,seq=[];for(let i of items)for(let k=0;k<copies;k++)seq.push(i);if(!seq.length){alert('Pehle image upload karein.');return}"""
          new2="""let W=210,H=297,m=+$('margin').value||0,g=+$('gap').value||0,w=+$('w').value,h=+$('h').value,copies=Math.max(1,+$('copies').value||1),cols=Math.max(1,Math.floor((W-2*m+g)/(w+g))),rows=Math.max(1,Math.floor((H-2*m+g)/(h+g))),per=cols*rows,seq=[];for(let k=0;k<copies;k++)for(let i of items)seq.push(i);if(!seq.length){alert('Pehle image upload karein.');return}"""
          if old2 not in s:
              raise SystemExit('PDF sequence block not found')
          s=s.replace(old2,new2,1)

          # PDF must not silently export an un-applied crop.
          marker="""$('pdfBtn').onclick=async()=>{if(!window.jspdf){alert('PDF library load nahi hui.');return}"""
          replacement="""$('pdfBtn').onclick=async()=>{if(items.some(i=>!i.cropApplied)){alert('Pehle har image ka border set karke ✂️ Crop & Preview dabayein.');return}if(!window.jspdf){alert('PDF library load nahi hui.');return}"""
          if marker not in s:
              raise SystemExit('PDF handler marker not found')
          s=s.replace(marker,replacement,1)

          # Ensure Crop & Preview applies the selected image only; then select the next image and repeat.
          if s==original:
              print('No changes needed')
          else:
              p.write_text(s,encoding='utf-8')
              print('Patched')
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add id-card-print.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix front back preview and copy count'
          git push
