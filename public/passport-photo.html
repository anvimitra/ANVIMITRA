<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Passport Photo Maker | ANVI E-Mitra & CSC Centre</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#eef3f8;color:#172033}.box{max-width:1050px;margin:20px auto;background:#fff;padding:22px;border-radius:16px}.up{display:block;border:2px dashed #1760a8;border-radius:12px;padding:30px;text-align:center;background:#f8fbff}.up input{display:block;margin:14px auto 0;max-width:100%;font-size:16px}.buttons{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}button{padding:12px 18px;border:0;border-radius:9px;font-weight:bold;cursor:pointer}button:disabled{opacity:.5}.pdf{background:#f4b400}.png{background:#10264d;color:#fff}.status{margin:14px 0;font-weight:bold}.note{font-size:13px;color:#667085}.preview{overflow:auto;background:#dce3eb;padding:12px;border-radius:10px}.a4{width:793px;height:1123px;background:#fff;position:relative;margin:auto}.p{position:absolute;width:125px;height:135px;object-fit:cover;border:1px solid #111;background:#fff}</style></head>
<body><div class="box"><a href="./">← Back</a><h1>Passport Photo Maker</h1><p>Upload a photo and create 6 passport photos on an A4 print sheet.</p><label class="up"><div style="font-size:20px">📷 <b>Choose Photo</b></div><small>JPG / PNG / WEBP</small><input id="file" type="file" accept="image/jpeg,image/png,image/webp,image/*"></label><div class="buttons"><button id="pdf" class="pdf" disabled>⬇ Save / Print A4 PDF</button><button id="png" class="png" disabled>⬇ Download A4 PNG</button></div><div id="status" class="status">Choose a photo.</div><p class="note">A4 2480×3508 px • photo 390×420 px (1.3×1.4 inch) • 6 photos • equal spacing • black border • white background • light enhancement • 300 DPI.</p><div class="preview"><div id="a4" class="a4"></div></div></div>
<script>
const fileInput=document.getElementById('file'),statusEl=document.getElementById('status'),a4=document.getElementById('a4'),pdfBtn=document.getElementById('pdf'),pngBtn=document.getElementById('png');const W=2480,H=3508,PW=390,PH=420,G=20,M=20;let photoData='',sheetBlob=null;function status(t){statusEl.textContent=t}function loadImage(src){return new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=()=>reject(new Error('Image could not be loaded'));im.src=src})}function enhance(ctx,w,h){const d=ctx.getImageData(0,0,w,h),p=d.data;for(let i=0;i<p.length;i+=4){p[i]=Math.min(255,p[i]*1.025+1);p[i+1]=Math.min(255,p[i+1]*1.025+1);p[i+2]=Math.min(255,p[i+2]*1.025+1)}ctx.putImageData(d,0,0)}async function makePhoto(file){status('Loading photo…');const src=URL.createObjectURL(file);try{const im=await loadImage(src);const sw=im.naturalWidth,sh=im.naturalHeight,c=document.createElement('canvas');c.width=PW;c.height=PH;const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,PW,PH);ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';const target=PW/PH;let cw,ch;if(sw/sh>target){ch=sh;cw=ch*target}else{cw=sw;ch=cw/target}const sx=(sw-cw)/2,sy=(sh-ch)/2;ctx.drawImage(im,sx,sy,cw,ch,0,0,PW,PH);enhance(ctx,PW,PH);return c.toDataURL('image/jpeg',.96)}finally{URL.revokeObjectURL(src)}}function buildSheet(){const c=document.createElement('canvas');c.width=W;c.height=H;const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);return loadImage(photoData).then(im=>{for(let i=0;i<6;i++){const x=M+i*(PW+G);ctx.drawImage(im,x,M,PW,PH);ctx.strokeStyle='#111';ctx.lineWidth=4;ctx.strokeRect(x+2,M+2,PW-4,PH-4)}return new Promise(resolve=>c.toBlob(resolve,'image/png'))})}function renderPreview(){a4.innerHTML='';for(let i=0;i<6;i++){const im=document.createElement('img');im.className='p';im.src=photoData;im.style.left=((M+i*(PW+G))*793/W)+'px';im.style.top=((M)*1123/H)+'px';a4.appendChild(im)}}fileInput.addEventListener('change',async()=>{const file=fileInput.files&&fileInput.files[0];if(!file)return;if(!file.type.startsWith('image/')){status('Please select a JPG, PNG or WEBP image.');return}pdfBtn.disabled=true;pngBtn.disabled=true;sheetBlob=null;try{photoData=await makePhoto(file);renderPreview();status('Creating A4 sheet…');sheetBlob=await buildSheet();pdfBtn.disabled=false;pngBtn.disabled=false;status('✓ Photo ready: 6 A4 photos generated.')}catch(e){console.error(e);status('Photo processing failed: '+(e.message||e))}});pngBtn.addEventListener('click',()=>{if(!sheetBlob)return;const url=URL.createObjectURL(sheetBlob);const a=document.createElement('a');a.href=url;a.download='ANVI_E-Mitra_Passport_A4_300DPI.png';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);status('✓ A4 PNG download started.')});pdfBtn.addEventListener('click',()=>{if(!photoData)return;const w=window.open('','_blank');if(!w){status('Please allow pop-ups for PDF printing.');return}let imgs='';for(let i=0;i<6;i++){const x=(M+i*(PW+G))*210/W,y=M*297/H;imgs+=`<img src="${photoData}" style="position:absolute;left:${x}mm;top:${y}mm;width:33.02mm;height:35.56mm;object-fit:cover;border:.35mm solid #111">`}w.document.write(`<!doctype html><html><head><title>ANVI E-Mitra A4</title><style>@page{size:A4;margin:0}html,body{margin:0;width:210mm;height:297mm;background:#fff}</style></head><body>${imgs}</body></html>`);w.document.close();setTimeout(()=>w.print(),500)});
</script></body></html>
