<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Passport Photo Maker | ANVI E-Mitra & CSC Centre</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#eef3f8;color:#172033}.box{max-width:1050px;margin:20px auto;background:#fff;padding:22px;border-radius:16px}.up{display:block;border:2px dashed #1760a8;border-radius:12px;padding:30px;text-align:center;background:#f8fbff}.up input{display:block;margin:14px auto 0;max-width:100%;font-size:16px}.buttons{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}button{padding:12px 18px;border:0;border-radius:9px;font-weight:bold;cursor:pointer}button:disabled{opacity:.5}.pdf{background:#f4b400}.png{background:#10264d;color:#fff}.status{margin:14px 0;font-weight:bold}.note{font-size:13px;color:#667085}.preview{overflow:auto;background:#dce3eb;padding:12px;border-radius:10px}.a4{width:793px;height:1123px;background:#fff;position:relative;margin:auto}.p{position:absolute;width:125px;height:135px;object-fit:cover;border:1px solid #111;background:#fff}</style></head><body><div class="box"><a href="./">← Back</a><h1>Passport Photo Maker</h1><p>Upload a photo and create 6 enhanced passport photos on an A4 print sheet.</p><label class="up"><div style="font-size:20px">📷 <b>Choose Photo</b></div><small>JPG / PNG / WEBP</small><input id="file" type="file" accept="image/jpeg,image/png,image/webp,image/*"></label><div class="buttons"><button id="pdf" class="pdf" disabled>⬇ Save / Print A4 PDF</button><button id="png" class="png" disabled>⬇ Download A4 PNG</button></div><div id="status" class="status">Choose a photo.</div><p class="note">AI portrait background removal • pure white background • face-aware 80% framing • subtle natural enhancement • A4 300 DPI • 1.3×1.4 inch photos • 6 copies.</p><div class="preview"><div id="a4" class="a4"></div></div></div><script>
const fileInput=document.getElementById('file'),statusEl=document.getElementById('status'),a4=document.getElementById('a4'),pdfBtn=document.getElementById('pdf'),pngBtn=document.getElementById('png');const W=2480,H=3508,PW=390,PH=420,G=20,M=20;let photoData='',sheetBlob=null;const loadImage=s=>new Promise((r,j)=>{const i=new Image;i.onload=()=>r(i);i.onerror=j;i.src=s});
async function detectFace(img){try{if('FaceDetector'in window){const d=new FaceDetector({fastMode:true,maxDetectedFaces:1}),f=await d.detect(img);if(f[0])return f[0].boundingBox}}catch(e){}try{const v=await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22');const fs=await v.FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm');const d=await v.FaceDetector.createFromOptions(fs,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite'},runningMode:'IMAGE',minDetectionConfidence:.4});const z=d.detect(img);d.close();const b=z.detections?.[0]?.boundingBox;if(b)return{x:b.originX,y:b.originY,width:b.width,height:b.height}}catch(e){console.warn(e)}return null}
async function aiRemove(file){statusEl.textContent='AI removing background…';const m=await import('https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.7.0/+esm'),fn=m.default||m.removeBackground;const blob=await Promise.race([fn(file,{model:'isnet_fp16',output:{format:'image/png',quality:1},progress:(k,c,t)=>{if(t)statusEl.textContent='AI background removal: '+Math.round(c/t*100)+'%'}}),new Promise((_,j)=>setTimeout(()=>j(new Error('AI timeout')),60000))]);return URL.createObjectURL(blob)}
function enhance(c){const d=c.getImageData(0,0,PW,PH),p=d.data;for(let i=0;i<p.length;i+=4){p[i]=Math.min(255,Math.max(0,(p[i]-128)*1.018+130));p[i+1]=Math.min(255,Math.max(0,(p[i+1]-128)*1.018+130));p[i+2]=Math.min(255,Math.max(0,(p[i+2]-128)*1.018+130))}c.putImageData(d,0,0)}
function whiteFallback(c){const d=c.getImageData(0,0,PW,PH),p=d.data;for(let i=0;i<p.length;i+=4){const r=p[i],g=p[i+1],b=p[i+2],lum=.299*r+.587*g+.114*b;if(lum>220&&Math.max(r,g,b)-Math.min(r,g,b)<45)p[i]=p[i+1]=p[i+2]=255}c.putImageData(d,0,0)}
async function makePhoto(file){const original=URL.createObjectURL(file);let cut=null;try{const orig=await loadImage(original);statusEl.textContent='Detecting face…';const face=await detectFace(orig);try{cut=await aiRemove(file)}catch(e){console.warn(e);statusEl.textContent='AI unavailable — using fallback…'}const src=cut||original,im=await loadImage(src),sw=im.naturalWidth,sh=im.naturalHeight;c=document.createElement('canvas');c.width=PW;c.height=PH;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,PW,PH);const ratio=PW/PH;let cw=sw,ch=sw/ratio;if(ch>sh){ch=sh;cw=ch*ratio}let sx=(sw-cw)/2,sy=(sh-ch)*.25;if(face){statusEl.textContent='Face detected — setting 80% face size…';const fx=face.x+face.width/2,fy=face.y+face.height*.5;const target=PH*.80;const scale=Math.max(1,Math.min(4,target/face.height));cw=Math.min(sw,cw/scale);ch=Math.min(sh,ch/scale);sx=fx-cw/2;sy=fy-ch*.44}sx=Math.max(0,Math.min(sw-cw,sx));sy=Math.max(0,Math.min(sh-ch,sy));x.imageSmoothingEnabled=true;x.imageSmoothingQuality='high';x.drawImage(im,sx,sy,cw,ch,0,0,PW,PH);if(cut){const d=x.getImageData(0,0,PW,PH),p=d.data;for(let i=0;i<p.length;i+=4){const a=p[i+3]/255;if(a<.999){p[i]=Math.round(p[i]*a+255*(1-a));p[i+1]=Math.round(p[i+1]*a+255*(1-a));p[i+2]=Math.round(p[i+2]*a+255*(1-a));p[i+3]=255}}x.putImageData(d,0,0)}else whiteFallback(x);enhance(x);return c.toDataURL('image/jpeg',.97)}finally{URL.revokeObjectURL(original);if(cut)URL.revokeObjectURL(cut)}}
function buildSheet(){const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,W,H);return loadImage(photoData).then(im=>{for(let i=0;i<6;i++){const xx=M+i*(PW+G);x.drawImage(im,xx,M,PW,PH);x.strokeStyle='#111';x.lineWidth=4;x.strokeRect(xx+2,M+2,PW-4,PH-4)}return new Promise(r=>c.toBlob(r,'image/png'))})}function renderPreview(){a4.innerHTML='';for(let i=0;i<6;i++){const im=document.createElement('img');im.className='p';im.src=photoData;im.style.left=((M+i*(PW+G))*793/W)+'px';im.style.top=(M*1123/H)+'px';a4.appendChild(im)}}fileInput.onchange=async()=>{const f=fileInput.files[0];if(!f)return;pdfBtn.disabled=pngBtn.disabled=true;try{photoData=await makePhoto(f);renderPreview();statusEl.textContent='Creating A4 sheet…';sheetBlob=await buildSheet();pdfBtn.disabled=pngBtn.disabled=false;statusEl.textContent='✓ Ready — white background + 80% face framing.'}catch(e){console.error(e);statusEl.textContent='Processing failed: '+e.message}};pngBtn.onclick=()=>{const u=URL.createObjectURL(sheetBlob),a=document.createElement('a');a.href=u;a.download='ANVI_E-Mitra_A4_300DPI.png';a.click();setTimeout(()=>URL.revokeObjectURL(u),1500)};pdfBtn.onclick=()=>{const w=open('','_blank');if(!w)return;let q='';for(let i=0;i<6;i++){const x=(M+i*(PW+G))*210/W,y=M*297/H;q+=`<img src="${photoData}" style="position:absolute;left:${x}mm;top:${y}mm;width:33.02mm;height:35.56mm;object-fit:cover;border:.35mm solid #111">`}w.document.write(`<style>@page{size:A4;margin:0}body{margin:0}</style>${q}`);w.document.close();setTimeout(()=>w.print(),500)};
</script></body></html>
