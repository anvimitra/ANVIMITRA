<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Passport Photo Maker</title><style>body{margin:0;font-family:Arial;background:#eef3f8;color:#17233c}.wrap{max-width:1000px;margin:auto;padding:18px}.card{background:white;border-radius:16px;padding:22px;box-shadow:0 8px 25px #0002}.back{display:block;margin-bottom:15px;color:#1457a6;text-decoration:none;font-weight:bold}.upload{display:block;border:2px dashed #1457a6;border-radius:12px;padding:25px;text-align:center;cursor:pointer;background:#f7fbff}.upload input{display:none}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:15px 0}.btn{padding:12px 17px;border:0;border-radius:9px;font-weight:bold;cursor:pointer}.pdf{background:#f4b400}.png{background:#10264d;color:white}.btn:disabled{opacity:.45}.status{font-weight:bold;margin:10px 0}.preview{background:#dce3eb;padding:12px;border-radius:10px;overflow:auto}.a4{width:793px;height:1123px;background:white;position:relative;margin:auto}.photo{position:absolute;width:125px;height:135px;border:2px solid #111;object-fit:cover;background:#fff}.note{font-size:13px;color:#667085;line-height:1.6}</style></head><body><main class="wrap"><div class="card"><a class="back" href="./">← Back</a><h1>Passport Photo Maker</h1><p>Upload a photo and create 6 passport photos on an A4 print sheet.</p><label class="upload"><b>📷 Choose Photo</b><br><small>JPG / PNG / WEBP</small><input id="file" type="file" accept="image/jpeg,image/png,image/webp"></label><div class="actions"><button id="pdf" class="btn pdf" disabled>Download A4 PDF</button><button id="png" class="btn png" disabled>Download A4 PNG</button></div><div id="status" class="status">Please select a photo.</div><p class="note">Photo: 1.3 × 1.4 inch • 390 × 420 px • A4 2480 × 3508 px • 300 DPI • 6 photos • equal spacing • black border.</p><div class="preview"><div id="a4" class="a4"></div></div></div></main><script>const file=document.getElementById('file'),a4=document.getElementById('a4'),pdf=document.getElementById('pdf'),png=document.getElementById('png'),status=document.getElementById('status');const AW=2480,AH=3508,PW=390,PH=420,G=16,M=30;let photoCanvas=null;function buildPhoto(img){const c=document.createElement('canvas');c.width=PW;c.height=PH;const q=c.getContext('2d');q.fillStyle='white';q.fillRect(0,0,PW,PH);q.imageSmoothingEnabled=true;q.imageSmoothingQuality='high';const target=PW/PH;let sw=img.naturalWidth,sh=img.naturalHeight;if(sw/sh>target)sw=sh*target;else sh=sw/target;let sx=(img.naturalWidth-sw)/2,sy=(img.naturalHeight-sh)*.30;q.drawImage(img,sx,Math.max(0,sy),sw,sh,0,0,PW,PH);const d=q.getImageData(0,0,PW,PH),p=d.data;for(let i=0;i<p.length;i+=4){let r=p[i],g=p[i+1],b=p[i+2],mx=Math.max(r,g,b),mn=Math.min(r,g,b);if(mx>210&&mx-mn<22){p[i]=p[i+1]=p[i+2]=255}else{p[i]=Math.min(255,r*1.01+1);p[i+1]=Math.min(255,g*1.01+1);p[i+2]=Math.min(255,b*1.005+1)}}q.putImageData(d,0,0);return c}function show(){a4.innerHTML='';const url=photoCanvas.toDataURL('image/jpeg',.96);for(let i=0;i<6;i++){const im=document.createElement('img');im.className='photo';im.src=url;im.style.left=(M+i*(PW+G))*(793/AW)+'px';im.style.top='0px';a4.appendChild(im)}pdf.disabled=false;png.disabled=false;status.textContent='✓ 6 photos ready.'}file.addEventListener('change',()=>{const f=file.files&&file.files[0];if(!f)return;status.textContent='Processing…';const reader=new FileReader();reader.onload=e=>{const img=new Image();img.onload=()=>{try{photoCanvas=buildPhoto(img);show()}catch(err){console.error(err);status.textContent='Photo processing failed.'}};img.onerror=()=>status.textContent='Image could not be opened.';img.src=e.target.result};reader.onerror=()=>status.textContent='Could not read file.';reader.readAsDataURL(f)});function makeSheet(){const c=document.createElement('canvas');c.width=AW;c.height=AH;const q=c.getContext('2d');q.fillStyle='white';q.fillRect(0,0,AW,AH);for(let i=0;i<6;i++){const x=M+i*(PW+G);q.drawImage(photoCanvas,x,0,PW,PH);q.strokeStyle='#111';q.lineWidth=4;q.strokeRect(x+2,2,PW-4,PH-4)}return c}png.onclick=()=>{const c=makeSheet();const a=document.createElement('a');a.href=c.toDataURL('image/png');a.download='Passport_A4_300DPI.png';a.click()};pdf.onclick=()=>{const c=makeSheet();const jpeg=c.toDataURL('image/jpeg',.94);const a4pdf=window.open('','_blank');if(a4pdf){a4pdf.document.write('<html><head><title>Passport A4</title></head><body style="margin:0"><img style="width:210mm;height:297mm;display:block" src="'+jpeg+'"></body></html>');a4pdf.document.close();setTimeout(()=>{a4pdf.print()},500)}else{status.textContent='Please allow pop-ups to print/save the A4 sheet.'}};</script></body></html>
